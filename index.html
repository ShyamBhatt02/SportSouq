    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('ss.preferences') || '{}');
          var t = p.theme || 'light';
          if (t === 'system') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
